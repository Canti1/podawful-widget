name: Tests

# Runs the unit tests (which also validate goons.json) on every push and PR,
# so a bad hand-edit of the goon list gets flagged.
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test test/
